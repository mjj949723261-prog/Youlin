<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧社区小程序 - 悦邻里高保真原型 (精简3项TabBar)</title>
  <style>
    :root {
      --primary-color: #10B981; /* 品牌翡翠绿 */
      --primary-light: #ECFDF5;
      --text-main: #111827;
      --text-sub: #6B7280;
      --bg-page: #F0F7F4;
      --card-bg: #FFFFFF;
      --border-color: #F1F5F9;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0F172A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    .phone-container {
      width: 390px;
      height: 844px;
      background: var(--bg-page);
      border-radius: 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 12px #1E293B;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 44px;
      background: var(--bg-page);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 600;
      color: #000;
      z-index: 100;
    }

    .custom-header {
      padding: 4px 16px 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }

    .community-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .location-icon {
      font-size: 18px;
      color: var(--primary-color);
    }

    .community-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }

    .banner-card {
      background: linear-gradient(180deg, #FEF9E7 0%, #EBF6ED 100%);
      border-radius: 20px;
      padding: 20px 16px 14px 16px;
      margin: 0 16px 16px 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.05);
    }

    .banner-title {
      font-size: 20px;
      font-weight: 800;
      color: #1B4D3E;
      display: block;
      margin-bottom: 4px;
    }

    .banner-sub {
      font-size: 12px;
      color: #5C7F73;
      display: block;
    }

    .banner-notice-strip {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-tag {
      font-size: 10px;
      font-weight: 700;
      color: #D97706;
      background: #FEF3C7;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .notice-text {
      font-size: 12px;
      color: #374151;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      margin-bottom: 14px;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .tab-item-tb {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-sub);
      position: relative;
      padding-bottom: 6px;
      cursor: pointer;
    }

    .tab-item-tb.active {
      color: #059669;
      font-size: 18px;
      font-weight: 800;
    }

    .tab-item-tb.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #059669;
      border-radius: 2px;
    }

    .filter-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #E6F4EA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #059669;
      cursor: pointer;
    }

    .tieba-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tieba-content::-webkit-scrollbar {
      display: none;
    }

    .post-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.03);
    }

    .post-user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .user-meta .name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .owner-tag {
      background: #E6F4EA;
      color: #137333;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .user-meta .time {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .content-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .post-text {
      font-size: 14px;
      color: #1F2937;
      line-height: 1.6;
      flex: 1;
    }

    .single-img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .post-footer {
      display: flex;
      align-items: center;
      margin-top: 4px;
      padding-top: 6px;
    }

    .tag-pill {
      font-size: 12px;
      font-weight: 600;
      color: #059669;
    }

    .tag-urgent {
      color: #DC2626;
    }

    .fab-post-btn {
      position: absolute;
      right: 20px;
      bottom: 75px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      z-index: 99;
    }

    /* 底栏 TabBar - 3项精简与图标设计 */
    .tab-bar {
      height: 60px;
      background: #FFFFFF;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 4px;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-sub);
      font-size: 11px;
      cursor: pointer;
      width: 33.33%;
    }

    .tab-item.active {
      color: var(--primary-color);
      font-weight: 800;
    }

    .tab-icon-svg {
      width: 22px;
      height: 22px;
      fill: var(--text-sub);
    }

    .tab-item.active .tab-icon-svg {
      fill: var(--primary-color);
    }

    /* 纯文字侧滑板块抽屉 */
    .drawer-mask {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-mask.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 76%;
      background: #FFFFFF;
      z-index: 1000;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      border-radius: 24px 0 0 24px;
      box-shadow: -6px 0 24px rgba(0,0,0,0.15);
    }

    .drawer-panel.active {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 44px 20px 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #F3F4F6;
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 800;
      color: #111827;
    }

    .close-btn {
      font-size: 18px;
      color: #9CA3AF;
      cursor: pointer;
    }

    .drawer-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .filter-group {
      margin-bottom: 24px;
    }

    .group-title {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 12px;
      display: block;
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip-item {
      padding: 8px 16px;
      border-radius: 20px;
      background: #F3F4F6;
      font-size: 12px;
      color: #4B5563;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-item.active {
      background: #E6F4EA;
      color: #059669;
      font-weight: 700;
      border: 1px solid #10B981;
    }

    .drawer-footer {
      padding: 16px 20px 24px 20px;
      display: flex;
      gap: 12px;
      border-top: 1px solid #F3F4F6;
    }

    .reset-btn {
      flex: 1;
      background: #F3F4F6;
      color: #4B5563;
      font-size: 14px;
      font-weight: 600;
      border-radius: 24px;
      border: none;
      padding: 12px 0;
      cursor: pointer;
    }

    .confirm-btn {
      flex: 2;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      border-radius: 24px;
      border: none;
      padding: 12px 0;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>

  <div class="phone-container">
    
    <div class="status-bar">
      <span>11:48</span>
      <span>5G 🔋</span>
    </div>

    <div class="custom-header">
      <div class="user-avatar" style="background:#059669; color:#FFF; display:flex; align-items:center; justify-content:center; font-weight:700;">张</div>
      <div class="community-selector">
        <span class="location-icon">📍</span>
        <span class="community-name">云栖花园</span>
      </div>
    </div>

    <div class="banner-card">
      <span class="banner-title">早上好，云栖花园</span>
      <span class="banner-sub">今天也有温暖的邻里故事</span>
      <div class="banner-notice-strip">
        <span class="badge-tag">📢 公告</span>
        <span class="notice-text">8月8日翠竹街道防汛隐患排查通知...</span>
      </div>
    </div>

    <div class="tab-filter-bar">
      <div class="tabs">
        <div class="tab-item-tb active">推荐</div>
        <div class="tab-item-tb">邻里圈</div>
        <div class="tab-item-tb">同城</div>
      </div>
      <div class="filter-btn" onclick="toggleDrawer(true)">⇌</div>
    </div>

    <div class="tieba-content">
      <div class="post-card">
        <div class="post-user-row">
          <div class="user-left">
            <div class="user-avatar" style="background:#E2E8F0; display:flex; align-items:center; justify-content:center;">👩</div>
            <div class="user-meta">
              <div class="name">王阿姨 · 3栋 <span class="owner-tag">本小区住户</span></div>
              <div class="time">10分钟前</div>
            </div>
          </div>
        </div>
        <div class="content-row">
          <div class="post-text">谁家有电钻可以借用半小时？装个置物架~</div>
          <div class="single-img" style="background:#F1F5F9; display:flex; align-items:center; justify-content:center; font-size:28px;">🛠️</div>
        </div>
        <div class="post-footer">
          <span class="tag-pill"># 邻里求助</span>
        </div>
      </div>

      <div class="post-card">
        <div class="post-user-row">
          <div class="user-left">
            <div class="user-avatar" style="background:#E2E8F0; display:flex; align-items:center; justify-content:center;">👤</div>
            <div class="user-meta">
              <div class="name">小林 · 8栋 <span class="owner-tag">本小区住户</span></div>
              <div class="time">18分钟前</div>
            </div>
          </div>
        </div>
        <div class="content-row">
          <div class="post-text">寻找橘猫团团，昨晚在南门附近走失，特征是脖子上有蓝色项圈，有看到的邻居请联系我，必有重谢！希望大家能帮忙留意一下，非常感谢！</div>
        </div>
        <div class="post-footer">
          <span class="tag-pill tag-urgent"># 紧急求助</span>
        </div>
      </div>
    </div>

    <div class="fab-post-btn">✏️</div>

    <!-- 底栏 TabBar: 精简为 3 个核心 Tab (带有高质感矢量图标) -->
    <div class="tab-bar">
      <!-- 1. 首页 (当前选中) -->
      <div class="tab-item active">
        <svg class="tab-icon-svg" viewBox="0 0 24 24">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V19a2 2 0 002 2h4a1 1 0 001-1v-4h2v4a1 1 0 001 1h4a2 2 0 002-2v-8.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
        </svg>
        <span>首页</span>
      </div>

      <!-- 2. 服务 -->
      <div class="tab-item">
        <svg class="tab-icon-svg" viewBox="0 0 24 24">
          <path d="M19.435 15.403l-4.839-4.839a.996.996 0 00-.707-.293h-.586l-2-2v-.586a1 1 0 00-.293-.707L6.17 2.139a1 1 0 00-1.414 0l-2.618 2.618a1 1 0 000 1.414l4.839 4.839c.188.188.442.293.707.293h.586l2 2v.586c0 .265.105.52.293.707l4.839 4.839a1 1 0 001.414 0l2.618-2.618a1 1 0 000-1.414z"/>
        </svg>
        <span>服务</span>
      </div>

      <!-- 3. 我的 -->
      <div class="tab-item">
        <svg class="tab-icon-svg" viewBox="0 0 24 24">
          <path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/>
        </svg>
        <span>我的</span>
      </div>
    </div>

    <!-- 侧滑板块抽屉 -->
    <div class="drawer-mask" id="drawerMask" onclick="toggleDrawer(false)"></div>
    <div class="drawer-panel" id="drawerPanel">
      <div class="drawer-header">
        <span class="drawer-title">板块筛选</span>
        <span class="close-btn" onclick="toggleDrawer(false)">✕</span>
      </div>

      <div class="drawer-body">
        <div class="filter-group">
          <span class="group-title">选择社区板块</span>
          <div class="chip-grid">
            <div class="chip-item active">全部板块</div>
            <div class="chip-item">邻里求助</div>
            <div class="chip-item">闲置面交</div>
            <div class="chip-item">房屋出租</div>
            <div class="chip-item">社区活动</div>
            <div class="chip-item">吐槽建议</div>
            <div class="chip-item">业委会公示</div>
          </div>
        </div>
      </div>

      <div class="drawer-footer">
        <button class="reset-btn">重置</button>
        <button class="confirm-btn" onclick="toggleDrawer(false)">确认筛选</button>
      </div>
    </div>

  </div>

  <script>
    function toggleDrawer(show) {
      const mask = document.getElementById('drawerMask');
      const panel = document.getElementById('drawerPanel');
      if (show) {
        mask.classList.add('active');
        panel.classList.add('active');
      } else {
        mask.classList.remove('active');
        panel.classList.remove('active');
      }
    }
  </script>
</body>
</html>
